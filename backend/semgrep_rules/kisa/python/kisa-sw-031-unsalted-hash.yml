rules:
  - id: kisa.sw31.python.password-hash-without-salt
    message: >-
      솔트 없이 일방향 해쉬 함수 사용 관련 보안 패턴이 탐지되었습니다.
      비밀번호는 단순 해시가 아니라 충분한 salt와 반복 비용을 가진 Argon2/bcrypt/scrypt/PBKDF2를 사용하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-31"
      kisa_name: "솔트 없이 일방향 해쉬 함수 사용"
      confidence: HIGH
      recommendation: >-
        비밀번호는 단순 해시가 아니라 충분한 salt와 반복 비용을 가진 Argon2/bcrypt/scrypt/PBKDF2를 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-759
      technology:
        - "python"
        - "password"
        - "hash"

    pattern-either:
      - pattern: >-
          hashlib.sha256($PASSWORD.encode(...)).hexdigest()
      - pattern: >-
          hashlib.sha512($PASSWORD.encode(...)).hexdigest()
      - pattern: >-
          hashlib.sha256($PASSWORD).hexdigest()
