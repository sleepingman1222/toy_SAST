rules:
  - id: kisa.sw12.python.external-input-to-http-client
    message: >-
      서버사이드 요청 위조 관련 보안 패턴이 탐지되었습니다.
      외부 입력 URL을 그대로 요청하지 말고 scheme/host/IP를 허용목록으로 검증하고 내부·메타데이터 주소를 차단하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-12"
      kisa_name: "서버사이드 요청 위조"
      confidence: HIGH
      recommendation: >-
        외부 입력 URL을 그대로 요청하지 말고 scheme/host/IP를 허용목록으로 검증하고 내부·메타데이터 주소를 차단하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-918
      technology:
        - "python"
        - "http"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  input(...)
              - pattern: >-
                  $REQ.GET.get(...)
              - pattern: >-
                  $REQ.POST.get(...)
              - pattern: >-
                  $REQ.args.get(...)
              - pattern: >-
                  $REQ.form.get(...)
              - pattern: >-
                  $REQ.json.get(...)
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  requests.get($URL, ...)
              - pattern: >-
                  requests.post($URL, ...)
              - pattern: >-
                  urllib.request.urlopen($URL, ...)
