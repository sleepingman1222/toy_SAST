rules:
  - id: kisa.sw43.python.external-input-to-deserializer
    message: >-
      신뢰할 수 없는 데이터의 역직렬화 관련 보안 패턴이 탐지되었습니다.
      신뢰할 수 없는 입력을 pickle/yaml unsafe loader 등으로 역직렬화하지 말고 안전한 데이터 형식과 스키마 검증을 사용하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-43"
      kisa_name: "신뢰할 수 없는 데이터의 역직렬화"
      confidence: HIGH
      recommendation: >-
        신뢰할 수 없는 입력을 pickle/yaml unsafe loader 등으로 역직렬화하지 말고 안전한 데이터 형식과 스키마 검증을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-502
      technology:
        - "python"
        - "deserialization"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  input(...)
              - pattern: >-
                  $REQ.GET.get(...)
              - pattern: >-
                  $REQ.POST.get(...)
              - pattern: >-
                  $REQ.args.get(...)
              - pattern: >-
                  $REQ.form.get(...)
              - pattern: >-
                  $REQ.json.get(...)
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  pickle.loads($DATA)
              - pattern: >-
                  pickle.load($DATA)
              - pattern: >-
                  yaml.load($DATA, ...)
              - pattern: >-
                  marshal.loads($DATA)
