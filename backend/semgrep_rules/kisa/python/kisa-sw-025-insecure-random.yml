rules:
  - id: kisa.sw25.python.insecure-random-for-security
    message: >-
      적절하지 않은 난수 값 사용 관련 보안 패턴이 탐지되었습니다.
      보안 토큰/인증값 생성에는 random 모듈 대신 secrets 또는 OS CSPRNG를 사용하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SEC-08"
      kisa_name: "적절하지 않은 난수 값 사용"
      confidence: HIGH
      recommendation: >-
        보안 토큰/인증값 생성에는 random 모듈 대신 secrets 또는 OS CSPRNG를 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-338
      technology:
        - "python"
        - "random"
        - "security"

    pattern-either:
      - pattern: >-
          random.random()
      - pattern: >-
          random.randint(...)
      - pattern: >-
          random.randrange(...)
      - pattern: >-
          random.choice(...)
