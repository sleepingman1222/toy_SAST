rules:
  - id: kisa.python.code-injection.external-input-to-eval-exec

    languages:
      - python

    message: >
      외부 입력값이 동적 코드 실행 함수로 전달되고 있습니다.
      eval/exec에 외부 입력값을 직접 전달하지 말고,
      필요한 경우 허용목록 기반의 명시적인 동작 매핑을 사용하세요.

    severity: ERROR

    mode: taint

    metadata:
      kisa_identifier: KISA-SW-002
      kisa_name: 코드 삽입
      confidence: high
      recommendation: >
        eval, exec와 같은 동적 코드 실행 함수의 사용을 피하세요.
        반드시 필요한 경우 외부 입력값을 코드로 직접 실행하지 말고
        허용목록 방식으로 검증된 값만 처리하세요.

    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: input(...)

    pattern-sinks:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: exec($CODE)
