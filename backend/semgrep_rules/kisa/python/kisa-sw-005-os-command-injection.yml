rules:
  - id: kisa.sw05.python.external-input-to-command
    message: >-
      운영체제 명령어 삽입 관련 보안 패턴이 탐지되었습니다.
      외부 입력을 shell 명령 문자열에 연결하지 말고 shell=False와 인자 배열, 실행 파일 허용목록을 사용하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-INP-05"
      kisa_name: "운영체제 명령어 삽입"
      confidence: HIGH
      recommendation: >-
        os.system/os.popen 및 subprocess의 shell=True 호출에 외부 입력이 포함된 문자열을 전달하지 마세요.
        subprocess.run/Popen 등에 shell=False와 인자 배열을 사용하고 실행 파일은 서버가 결정한
        허용목록 값으로 제한하세요.
      rule_version: "1.1.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-78
      technology:
        - "python"
        - "os"
        - "subprocess"
        - "django"
        - "flask"

    mode: taint

    pattern-sources:
      - pattern-either:
          - pattern: input(...)
          - pattern: sys.argv[$INDEX]
          - pattern: $REQ.GET.get(...)
          - pattern: $REQ.GET[$KEY]
          - pattern: $REQ.POST.get(...)
          - pattern: $REQ.POST[$KEY]
          - pattern: $REQ.headers.get(...)
          - pattern: $REQ.headers[$KEY]
          - pattern: $REQ.args.get(...)
          - pattern: $REQ.args[$KEY]
          - pattern: $REQ.form.get(...)
          - pattern: $REQ.form[$KEY]
          - pattern: $REQ.values.get(...)
          - pattern: $REQ.values[$KEY]
          - pattern: $REQ.json.get(...)
          - pattern: $REQ.json[$KEY]
          - pattern: $REQ.get_json().get(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern: subprocess.call($CMD, ..., shell=True, ...)
              - pattern: subprocess.run($CMD, ..., shell=True, ...)
              - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
              - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
              - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern: subprocess.getoutput($CMD)
              - pattern: subprocess.getstatusoutput($CMD)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from os import system
                  ...
              - pattern-inside: |
                  from os import system, ...
                  ...
          - pattern: system($CMD)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from os import popen
                  ...
              - pattern-inside: |
                  from os import popen, ...
                  ...
          - pattern: popen($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from subprocess import run
                  ...
              - pattern-inside: |
                  from subprocess import run, ...
                  ...
          - pattern: run($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from subprocess import call
                  ...
              - pattern-inside: |
                  from subprocess import call, ...
                  ...
          - pattern: call($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from subprocess import Popen
                  ...
              - pattern-inside: |
                  from subprocess import Popen, ...
                  ...
          - pattern: Popen($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from subprocess import check_call
                  ...
              - pattern-inside: |
                  from subprocess import check_call, ...
                  ...
          - pattern: check_call($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from subprocess import check_output
                  ...
              - pattern-inside: |
                  from subprocess import check_output, ...
                  ...
          - pattern: check_output($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
