rules:
  - id: kisa.sw13.python.external-input-to-response-header
    message: >-
      HTTP 응답분할 관련 보안 패턴이 탐지되었습니다.
      응답 헤더 값에 외부 입력을 직접 사용하지 말고 CR/LF를 거부하고 필요한 값만 허용목록으로 검증하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-13"
      kisa_name: "HTTP 응답분할"
      confidence: HIGH
      recommendation: >-
        응답 헤더 값에 외부 입력을 직접 사용하지 말고 CR/LF를 거부하고 필요한 값만 허용목록으로 검증하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-113
      technology:
        - "python"
        - "web"
        - "http"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  input(...)
              - pattern: >-
                  $REQ.GET.get(...)
              - pattern: >-
                  $REQ.POST.get(...)
              - pattern: >-
                  $REQ.args.get(...)
              - pattern: >-
                  $REQ.form.get(...)
              - pattern: >-
                  $REQ.json.get(...)
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  $RESP[$HEADER] = $VALUE
              - pattern: >-
                  $RESP.headers[$HEADER] = $VALUE
