rules:
  - id: kisa.sw42.python.annotation-without-value-use-review
    message: >-
      초기화되지 않은 변수 사용 관련 보안 패턴이 탐지되었습니다.
      값이 할당되지 않은 지역 변수를 사용하지 말고 선언 시 초기화하거나 모든 제어 경로에서 대입을 보장하세요.
    languages:
      - python
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-42"
      kisa_name: "초기화되지 않은 변수 사용"
      confidence: MEDIUM
      recommendation: >-
        값이 할당되지 않은 지역 변수를 사용하지 말고 선언 시 초기화하거나 모든 제어 경로에서 대입을 보장하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-457
      technology:
        - "python"
        - "variables"

    pattern-either:
      - pattern: |
          $X: $TYPE
          ...
          return $X
      - pattern: |
          $X: $TYPE
          ...
          $F($X)
