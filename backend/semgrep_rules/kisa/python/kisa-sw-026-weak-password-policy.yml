rules:
  - id: kisa.sw26.python.weak-minimum-password-length
    message: >-
      취약한 비밀번호 허용 관련 보안 패턴이 탐지되었습니다.
      비밀번호 최소 길이와 조합 정책을 조직 기준에 맞게 강화하세요. 이 Rule은 8자 미만 허용 패턴을 감사합니다.
    languages:
      - python
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-26"
      kisa_name: "취약한 비밀번호 허용"
      confidence: MEDIUM
      recommendation: >-
        비밀번호 최소 길이와 조합 정책을 조직 기준에 맞게 강화하세요. 이 Rule은 8자 미만 허용 패턴을 감사합니다.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-521
      technology:
        - "python"
        - "password-policy"

    patterns:
      - pattern: >-
          len($PASSWORD) >= $N
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 8
