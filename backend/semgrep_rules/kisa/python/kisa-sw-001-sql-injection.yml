rules:
  - id: kisa.sw01.python.dbapi-string-built-query
    message: >-
      외부 값이 포함될 수 있는 문자열 조합 SQL을 execute 계열 함수에
      직접 전달하고 있습니다. Parameterized Query를 사용하세요.
    languages:
      - python
    severity: ERROR

    metadata:
      kisa_identifier: KISA-SW-01
      kisa_name: SQL 삽입
      confidence: MEDIUM
      recommendation: >-
        SQL 문자열에 외부 입력값을 직접 결합하지 말고 DB 드라이버가 제공하는
        Parameterized Query 또는 안전한 ORM 바인딩 기능을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      cwe:
        - CWE-89
      technology:
        - python
        - db-api

    pattern-either:
      - pattern: $CURSOR.execute($SQL + $INPUT, ...)
      - pattern: $CURSOR.execute($SQL % $INPUT, ...)
      - pattern: $CURSOR.execute($SQL.format(...), ...)
      - pattern: $CURSOR.executemany($SQL + $INPUT, ...)
