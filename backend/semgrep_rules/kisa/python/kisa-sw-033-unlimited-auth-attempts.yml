rules:
  - id: kisa.sw33.python.login-handler-rate-limit-review
    message: >-
      반복된 인증시도 제한 기능 부재 관련 보안 패턴이 탐지되었습니다.
      로그인 처리 함수에 사용자/IP 기준 실패 횟수 제한, 지연, 잠금 또는 rate limit이 적용되는지 수동 검토하세요.
    languages:
      - python
    severity: INFO

    metadata:
      kisa_identifier: "KISA-SW-33"
      kisa_name: "반복된 인증시도 제한 기능 부재"
      confidence: LOW
      recommendation: >-
        로그인 처리 함수에 사용자/IP 기준 실패 횟수 제한, 지연, 잠금 또는 rate limit이 적용되는지 수동 검토하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: manual_review
      cwe:
        - CWE-307
      technology:
        - "python"
        - "authentication"
        - "rate-limit"

    patterns:
      - pattern: |
          def $F(...):
              ...
              authenticate(...)
              ...
      - metavariable-regex:
          metavariable: $F
          regex: >-
            (?i).*login.*
