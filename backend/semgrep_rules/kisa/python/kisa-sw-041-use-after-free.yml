rules:
  - id: kisa.sw41.python.native-use-after-free-review
    message: >-
      해제된 자원 사용 관련 보안 패턴이 탐지되었습니다.
      ctypes/native pointer를 free한 뒤 다시 사용하지 말고 소유권과 lifetime을 명확히 관리하세요.
    languages:
      - python
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-41"
      kisa_name: "해제된 자원 사용"
      confidence: MEDIUM
      recommendation: >-
        ctypes/native pointer를 free한 뒤 다시 사용하지 말고 소유권과 lifetime을 명확히 관리하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-416
      technology:
        - "python"
        - "ctypes"
        - "native-memory"

    pattern-either:
      - pattern: |
          $LIB.free($PTR)
          ...
          ctypes.string_at($PTR, ...)
      - pattern: |
          $LIB.free($PTR)
          ...
          ctypes.memmove(..., $PTR, ...)
