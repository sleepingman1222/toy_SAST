rules:
  - id: kisa.sw01.java.jdbc-string-built-query
    message: >-
      문자열 결합으로 생성한 SQL을 JDBC Statement 실행 함수에 전달하고
      있습니다. PreparedStatement와 바인딩 변수를 사용하세요.
    languages:
      - java
    severity: ERROR

    metadata:
      kisa_identifier: KISA-SW-01
      kisa_name: SQL 삽입
      confidence: MEDIUM
      recommendation: >-
        사용자 입력값을 SQL 문자열에 직접 결합하지 말고 PreparedStatement를
        사용하여 ? placeholder와 setString/setInt 등의 바인딩 API로 값을
        전달하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      cwe:
        - CWE-89
      technology:
        - java
        - jdbc

    pattern-either:
      - pattern: $STMT.executeQuery($SQL + $INPUT)
      - pattern: $STMT.executeUpdate($SQL + $INPUT)
      - pattern: $STMT.execute($SQL + $INPUT)
      - pattern: $STMT.addBatch($SQL + $INPUT)
