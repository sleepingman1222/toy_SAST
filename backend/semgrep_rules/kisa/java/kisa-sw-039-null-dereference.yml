rules:
  - id: kisa.sw39.java.nullable-map-result-dereference
    message: >-
      Null Pointer 역참조 관련 보안 패턴이 탐지되었습니다.
      null 가능 결과를 바로 역참조하지 말고 명시적 null 검사 또는 Optional 흐름을 사용하세요.
    languages:
      - java
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-39"
      kisa_name: "Null Pointer 역참조"
      confidence: MEDIUM
      recommendation: >-
        null 가능 결과를 바로 역참조하지 말고 명시적 null 검사 또는 Optional 흐름을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-476
      technology:
        - "java"
        - "null-safety"

    pattern-either:
      - pattern: >-
          $MAP.get($KEY).$METHOD(...)
      - pattern: >-
          $OPTIONAL.orElse(null).$METHOD(...)
