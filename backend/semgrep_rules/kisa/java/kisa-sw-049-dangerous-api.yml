rules:
  - id: kisa.sw49.java.dangerous-api-use
    message: >-
      취약한 API 사용 관련 보안 패턴이 탐지되었습니다.
      위험하거나 폐기된 API 사용을 피하고 목적에 맞는 안전한 대체 API와 명시적 권한/입력 검증을 사용하세요.
    languages:
      - java
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-API-02"
      kisa_name: "취약한 API 사용"
      confidence: HIGH
      recommendation: >-
        위험하거나 폐기된 API 사용을 피하고 목적에 맞는 안전한 대체 API와 명시적 권한/입력 검증을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-676
      technology:
        - "java"
        - "dangerous-api"

    pattern-either:
      - pattern: >-
          $THREAD.stop()
      - pattern: >-
          Runtime.getRuntime().exec(...)
      - pattern: >-
          System.setSecurityManager(null)
