rules:
  - id: kisa.sw48.java.dns-result-used-for-security-decision-review
    message: >-
      DNS lookup에 의존한 보안결정 관련 보안 패턴이 탐지되었습니다.
      DNS 이름/IP 조회 결과만으로 보안 결정을 하지 말고 인증서/서명/서버 측 신뢰 정책을 사용하세요.
    languages:
      - java
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-API-01"
      kisa_name: "DNS lookup에 의존한 보안결정"
      confidence: MEDIUM
      recommendation: >-
        DNS 이름/IP 조회 결과만으로 보안 결정을 하지 말고 인증서/서명/서버 측 신뢰 정책을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-247
      technology:
        - "java"
        - "dns"
        - "authorization"

    pattern-either:
      - pattern: |
          $ADDR = InetAddress.getByName($HOST);
          ...
          if ($ADDR.getHostName().equals($TRUSTED)) {
              ...
          }
      - pattern: |
          $ADDR = InetAddress.getByName($HOST);
          ...
          if ($ADDR.getHostAddress().equals($TRUSTED)) {
              ...
          }
