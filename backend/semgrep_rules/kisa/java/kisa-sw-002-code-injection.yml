rules:
  - id: kisa.java.code-injection.external-input-to-script-engine

    languages:
      - java

    message: >
      외부 입력값이 동적 코드 실행 함수로 전달되고 있습니다.
      외부 입력값을 코드로 직접 실행하지 말고,
      필요한 경우 허용목록 기반으로 검증된 값만 사용하세요.

    severity: ERROR

    mode: taint

    metadata:
      kisa_identifier: KISA-SW-002
      kisa_name: 코드 삽입
      confidence: high
      recommendation: >
        동적 코드를 실행하는 함수의 사용을 피하세요.
        반드시 필요한 경우 외부 입력값을 코드로 직접 사용하지 말고
        허용목록 방식으로 검증한 값만 사용하세요.

    pattern-sources:
      - pattern-either:
          - pattern: $REQUEST.getParameter(...)
          - pattern: $REQUEST.getHeader(...)
          - pattern: $REQUEST.getQueryString()

    pattern-sinks:
      - pattern: $ENGINE.eval($CODE)
