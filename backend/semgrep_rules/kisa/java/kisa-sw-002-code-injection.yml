rules:
  - id: kisa.sw02.java.external-input-to-script-engine
    message: >-
      외부 입력값이 Java ScriptEngine의 동적 코드 실행 기능에 전달되고 있습니다.
      외부 입력을 코드로 실행하지 않도록 구조를 변경하세요.
    languages: [java]
    severity: ERROR
    mode: taint
    metadata:
      kisa_identifier: KISA-INP-02
      kisa_name: 코드 삽입
      confidence: HIGH
      recommendation: >-
        HttpServletRequest 등의 외부 입력을 ScriptEngine.eval에 직접 전달하지 마세요.
        필요한 동작은 허용목록으로 정의하고 외부 입력은 식별자로만 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      cwe: [CWE-94, CWE-95]
      technology: [java, javax-script]
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.getQueryString()
    pattern-sinks:
      - pattern-either:
          - pattern: $ENGINE.eval($X)
          - pattern: $ENGINE.eval($X, ...)
