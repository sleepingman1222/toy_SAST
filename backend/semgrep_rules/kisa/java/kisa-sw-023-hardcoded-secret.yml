rules:
  - id: kisa.sw23.java.hardcoded-sensitive-value
    message: >-
      하드코드된 중요정보 관련 보안 패턴이 탐지되었습니다.
      비밀번호/API Key/Token을 소스에 하드코딩하지 말고 외부 secret store 또는 안전한 설정 주입을 사용하세요.
    languages:
      - java
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-23"
      kisa_name: "하드코드된 중요정보"
      confidence: HIGH
      recommendation: >-
        비밀번호/API Key/Token을 소스에 하드코딩하지 말고 외부 secret store 또는 안전한 설정 주입을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-798
      technology:
        - "java"
        - "secrets"

    pattern-regex: >-
      (?i)(password|passwd|secret|api[_-]?key|access[_-]?token)\s*=\s*["'][^"'\n]{4,}["']
