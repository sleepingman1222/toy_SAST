rules:
  - id: kisa.sw41.java.unsafe-use-after-free-review
    message: >-
      해제된 자원 사용 관련 보안 패턴이 탐지되었습니다.
      Unsafe native memory를 free한 주소로 다시 접근하지 말고 lifetime을 단일 소유자로 관리하세요.
    languages:
      - java
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-COD-03"
      kisa_name: "해제된 자원 사용"
      confidence: MEDIUM
      recommendation: >-
        Unsafe native memory를 free한 주소로 다시 접근하지 말고 lifetime을 단일 소유자로 관리하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-416
      technology:
        - "java"
        - "unsafe"
        - "native-memory"

    pattern-either:
      - pattern: |
          $U.freeMemory($ADDR);
          ...
          $U.getByte($ADDR);
      - pattern: |
          $U.freeMemory($ADDR);
          ...
          $U.putByte($ADDR, ...);
