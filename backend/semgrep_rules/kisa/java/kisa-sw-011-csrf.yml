rules:
  - id: kisa.sw11.java.csrf-protection-disabled
    message: >-
      크로스사이트 요청 위조 관련 보안 패턴이 탐지되었습니다.
      Spring Security 등의 CSRF 보호를 전역 비활성화하지 말고 상태 변경 요청에 CSRF token 검증을 적용하세요.
    languages:
      - java
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-11"
      kisa_name: "크로스사이트 요청 위조"
      confidence: MEDIUM
      recommendation: >-
        Spring Security 등의 CSRF 보호를 전역 비활성화하지 말고 상태 변경 요청에 CSRF token 검증을 적용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-352
      technology:
        - "java"
        - "spring-security"
        - "csrf"

    pattern-either:
      - pattern: >-
          $HTTP.csrf().disable()
      - pattern: >-
          $HTTP.csrf($CSRF -> $CSRF.disable())
