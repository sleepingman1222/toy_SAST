rules:
  - id: kisa.sw04.java.external-input-to-html-response
    message: >-
      크로스사이트 스크립트 관련 보안 패턴이 탐지되었습니다.
      외부 입력을 HTML 출력에 직접 쓰지 말고 OWASP Encoder 등 컨텍스트에 맞는 출력 인코딩을 사용하세요.
    languages:
      - java
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-04"
      kisa_name: "크로스사이트 스크립트"
      confidence: HIGH
      recommendation: >-
        외부 입력을 HTML 출력에 직접 쓰지 말고 OWASP Encoder 등 컨텍스트에 맞는 출력 인코딩을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-79
      technology:
        - "java"
        - "servlet"
        - "web"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  $REQ.getParameter(...)
              - pattern: >-
                  $REQ.getHeader(...)
              - pattern: >-
                  $REQ.getQueryString()
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  $RESP.getWriter().print($X)
              - pattern: >-
                  $RESP.getWriter().write($X)
              - pattern: >-
                  $WRITER.print($X)
              - pattern: >-
                  $WRITER.write($X)
