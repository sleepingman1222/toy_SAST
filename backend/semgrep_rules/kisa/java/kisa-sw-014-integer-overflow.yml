rules:
  - id: kisa.sw14.java.external-input-arithmetic-review
    message: >-
      외부 입력에서 변환된 int 값이 곱셈 연산에 사용되고 있습니다.
      정수 오버플로우 가능성을 검토하세요.
    languages:
      - java
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-INP-14"
      kisa_name: "정수형 오버플로우"
      confidence: MEDIUM
      recommendation: >-
        외부 입력을 int 산술 연산에 사용할 때 값의 범위를 명시적으로
        검증하고, 필요한 경우 long 타입 또는 Math.multiplyExact 등의
        오버플로우 검출 API를 사용하세요.
      rule_version: "1.0.1"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-190
      technology:
        - java
        - integer

    patterns:
      - pattern-inside: |
          $RET $METHOD(...) {
              ...
              int $X = Integer.parseInt($REQ.getParameter(...));
              ...
          }

      - pattern-either:
          - pattern: $X * $Y
          - pattern: $Y * $X