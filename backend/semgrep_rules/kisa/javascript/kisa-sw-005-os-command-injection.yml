rules:
  - id: kisa.sw05.javascript.external-input-to-command
    message: >-
      운영체제 명령어 삽입 관련 보안 패턴이 탐지되었습니다.
      외부 입력을 shell command 문자열에 연결하지 말고 execFile/spawn의 shell 비활성화 방식과
      분리된 인자 배열을 사용하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-INP-05"
      kisa_name: "운영체제 명령어 삽입"
      confidence: HIGH
      recommendation: >-
        child_process.exec/execSync에 외부 입력이 포함된 command 문자열을 전달하지 마세요.
        가능하면 execFile 또는 shell:false인 spawn을 사용하고 실행 파일은 허용목록으로 제한하세요.
        spawn/spawnSync에서 shell:true를 사용할 경우 command와 argument 모두 shell 명령으로
        해석될 수 있으므로 외부 입력을 전달하지 마세요.
      rule_version: "1.1.1"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-78
      technology:
        - "javascript"
        - "nodejs"
        - "child_process"

    mode: taint

    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$KEY
          - pattern: $REQ.query[$KEY]
          - pattern: $REQ.body.$KEY
          - pattern: $REQ.body[$KEY]
          - pattern: $REQ.params.$KEY
          - pattern: $REQ.params[$KEY]
          - pattern: $REQ.headers[$KEY]
          - pattern: $REQ.get(...)
          - pattern: $REQ.header(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $CP = require("child_process");
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const { exec } = require("child_process");
                  ...
              - pattern-inside: |
                  const { exec } = require("node:child_process");
                  ...
              - pattern-inside: |
                  const { exec, ... } = require("child_process");
                  ...
              - pattern-inside: |
                  const { exec, ... } = require("node:child_process");
                  ...
          - pattern: exec($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const { execSync } = require("child_process");
                  ...
              - pattern-inside: |
                  const { execSync } = require("node:child_process");
                  ...
              - pattern-inside: |
                  const { ..., execSync } = require("child_process");
                  ...
              - pattern-inside: |
                  const { ..., execSync } = require("node:child_process");
                  ...
          - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { exec } from "child_process";
                  ...
              - pattern-inside: |
                  import { exec } from "node:child_process";
                  ...
          - pattern: exec($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { execSync } from "child_process";
                  ...
              - pattern-inside: |
                  import { execSync } from "node:child_process";
                  ...
          - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $CP = require("child_process");
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
          - pattern-either:
              - pattern: >-
                  $CP.spawn($CMD, $ARGS, { ..., shell: true, ... })
              - pattern: >-
                  $CP.spawnSync($CMD, $ARGS, { ..., shell: true, ... })
          - focus-metavariable: $CMD

      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $CP = require("child_process");
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
          - pattern-either:
              - pattern: >-
                  $CP.spawn($CMD, $ARGS, { ..., shell: true, ... })
              - pattern: >-
                  $CP.spawnSync($CMD, $ARGS, { ..., shell: true, ... })
          - focus-metavariable: $ARGS
