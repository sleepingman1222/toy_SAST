rules:
  - id: kisa.sw01.javascript.sql-client-string-built-query
    message: >-
      문자열 결합으로 생성한 SQL을 query/execute 계열 함수에 전달하고
      있습니다. SQL Parameter Binding을 사용하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: KISA-SW-01
      kisa_name: SQL 삽입
      confidence: MEDIUM
      recommendation: >-
        요청값이나 외부 입력을 SQL 문자열에 직접 결합하지 말고 사용 중인
        SQL Client의 placeholder와 parameter binding 기능을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      cwe:
        - CWE-89
      technology:
        - javascript
        - sql-client

    pattern-either:
      - pattern: $DB.query($SQL + $INPUT, ...)
      - pattern: $DB.execute($SQL + $INPUT, ...)
