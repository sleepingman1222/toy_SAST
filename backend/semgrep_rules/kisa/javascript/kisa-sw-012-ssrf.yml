rules:
  - id: kisa.sw12.javascript.external-input-to-http-client
    message: >-
      서버사이드 요청 위조 관련 보안 패턴이 탐지되었습니다.
      외부 입력 URL을 그대로 요청하지 말고 scheme/host/IP를 허용목록으로 검증하고 내부·메타데이터 주소를 차단하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-INP-12"
      kisa_name: "서버사이드 요청 위조"
      confidence: HIGH
      recommendation: >-
        외부 입력 URL을 그대로 요청하지 말고 scheme/host/IP를 허용목록으로 검증하고 내부·메타데이터 주소를 차단하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-918
      technology:
        - "javascript"
        - "nodejs"
        - "http"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  $REQ.query.$KEY
              - pattern: >-
                  $REQ.body.$KEY
              - pattern: >-
                  $REQ.params.$KEY
              - pattern: >-
                  $REQ.headers[$KEY]
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  axios.get($URL, ...)
              - pattern: >-
                  fetch($URL, ...)
              - pattern: >-
                  http.get($URL, ...)
              - pattern: >-
                  https.get($URL, ...)
