rules:
  - id: kisa.sw28.javascript.certificate-validation-disabled
    message: >-
      부적절한 인증서 유효성 검증 관련 보안 패턴이 탐지되었습니다.
      TLS rejectUnauthorized를 비활성화하거나 NODE_TLS_REJECT_UNAUTHORIZED=0을 사용하지 마세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SEC-11"
      kisa_name: "부적절한 인증서 유효성 검증"
      confidence: HIGH
      recommendation: >-
        TLS rejectUnauthorized를 비활성화하거나 NODE_TLS_REJECT_UNAUTHORIZED=0을 사용하지 마세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-295
      technology:
        - "javascript"
        - "nodejs"
        - "tls"
        - "certificate"

    pattern-either:
      - pattern: >-
          new https.Agent({..., rejectUnauthorized: false, ...})
      - pattern: >-
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: >-
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
