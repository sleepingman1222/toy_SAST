rules:
  - id: kisa.sw26.javascript.weak-minimum-password-length
    message: >-
      취약한 비밀번호 허용 관련 보안 패턴이 탐지되었습니다.
      비밀번호 최소 길이를 조직 정책에 맞게 설정하세요. 이 Rule은 8자 미만 최소 길이 검사를 찾습니다.
    languages:
      - javascript
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SEC-09"
      kisa_name: "취약한 비밀번호 허용"
      confidence: MEDIUM
      recommendation: >-
        비밀번호 최소 길이를 조직 정책에 맞게 설정하세요. 이 Rule은 8자 미만 최소 길이 검사를 찾습니다.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-521
      technology:
        - "javascript"
        - "password-policy"

    patterns:
      - pattern: >-
          $PASSWORD.length >= $N
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 8
