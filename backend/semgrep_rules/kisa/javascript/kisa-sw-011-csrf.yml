rules:
  - id: kisa.sw11.javascript.state-changing-route-review
    message: >-
      크로스사이트 요청 위조 관련 보안 패턴이 탐지되었습니다.
      JavaScript 웹 프레임워크의 상태 변경 endpoint는 쿠키 기반 인증을 사용할 경우 CSRF token 또는 SameSite 정책을 수동 검토하세요.
    languages:
      - javascript
    severity: INFO

    metadata:
      kisa_identifier: "KISA-SW-11"
      kisa_name: "크로스사이트 요청 위조"
      confidence: LOW
      recommendation: >-
        JavaScript 웹 프레임워크의 상태 변경 endpoint는 쿠키 기반 인증을 사용할 경우 CSRF token 또는 SameSite 정책을 수동 검토하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: manual_review
      cwe:
        - CWE-352
      technology:
        - "javascript"
        - "express"
        - "csrf"

    pattern-either:
      - pattern: >-
          $APP.post($PATH, $HANDLER)
      - pattern: >-
          $APP.put($PATH, $HANDLER)
      - pattern: >-
          $APP.patch($PATH, $HANDLER)
      - pattern: >-
          $APP.delete($PATH, $HANDLER)
