rules:
  - id: kisa.sw13.javascript.external-input-to-response-header
    message: >-
      HTTP 응답분할 관련 보안 패턴이 탐지되었습니다.
      응답 헤더 값에 외부 입력을 직접 사용하지 말고 CR/LF를 거부하고 필요한 값만 허용목록으로 검증하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-13"
      kisa_name: "HTTP 응답분할"
      confidence: HIGH
      recommendation: >-
        응답 헤더 값에 외부 입력을 직접 사용하지 말고 CR/LF를 거부하고 필요한 값만 허용목록으로 검증하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-113
      technology:
        - "javascript"
        - "express"
        - "http"

    mode: taint
    pattern-sources:
      - pattern-either:
              - pattern: >-
                  $REQ.query.$KEY
              - pattern: >-
                  $REQ.body.$KEY
              - pattern: >-
                  $REQ.params.$KEY
              - pattern: >-
                  $REQ.headers[$KEY]
    pattern-sinks:
      - pattern-either:
              - pattern: >-
                  $RES.setHeader($NAME, $VALUE)
              - pattern: >-
                  $RES.header($NAME, $VALUE)
              - pattern: >-
                  $RES.set($NAME, $VALUE)
