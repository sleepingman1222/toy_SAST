rules:
  - id: kisa.sw46.javascript.private-array-return-review
    message: >-
      Public 메서드로부터 반환된 Private 배열 관련 보안 패턴이 탐지되었습니다.
      private field의 mutable 배열을 직접 반환하지 말고 spread/copy 또는 불변 값을 반환하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-ENC-03"
      kisa_name: "Public 메서드로부터 반환된 Private 배열"
      confidence: HIGH
      recommendation: >-
        private field의 mutable 배열을 직접 반환하지 말고 spread/copy 또는 불변 값을 반환하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-495
      technology:
        - "javascript"
        - "encapsulation"

    pattern-either:
      - pattern: |
          class $C {
            #$FIELD = $VALUE;
            ...
            $METHOD(...) {
              ...
              return this.#$FIELD;
            }
            ...
          }
