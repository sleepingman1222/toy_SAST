rules:
  - id: kisa.sw21.javascript.weak-cryptographic-algorithm
    message: >-
      취약한 암호화 알고리즘 사용 관련 보안 패턴이 탐지되었습니다.
      MD5/SHA-1/DES/RC4 대신 SHA-256 이상 및 AES-GCM 등 안전한 알고리즘을 사용하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SEC-04"
      kisa_name: "취약한 암호화 알고리즘 사용"
      confidence: HIGH
      recommendation: >-
        MD5/SHA-1/DES/RC4 대신 SHA-256 이상 및 AES-GCM 등 안전한 알고리즘을 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-327
      technology:
        - "javascript"
        - "nodejs"
        - "cryptography"

    pattern-either:
      - pattern: >-
          crypto.createHash("md5")
      - pattern: >-
          crypto.createHash("sha1")
      - pattern: >-
          crypto.createCipher("des", ...)
      - pattern: >-
          crypto.createCipher("rc4", ...)
