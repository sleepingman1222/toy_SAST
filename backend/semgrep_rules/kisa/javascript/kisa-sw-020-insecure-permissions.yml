rules:
  - id: kisa.sw20.javascript.world-writable-permission
    message: >-
      중요한 자원에 대한 잘못된 권한 설정 관련 보안 패턴이 탐지되었습니다.
      파일/디렉터리에 최소 권한을 적용하고 world-writable 모드를 사용하지 마세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-20"
      kisa_name: "중요한 자원에 대한 잘못된 권한 설정"
      confidence: HIGH
      recommendation: >-
        파일/디렉터리에 최소 권한을 적용하고 world-writable 모드를 사용하지 마세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-732
      technology:
        - "javascript"
        - "nodejs"
        - "filesystem"
        - "permissions"

    pattern-either:
      - pattern: >-
          fs.chmodSync($PATH, 0o777)
      - pattern: >-
          fs.chmodSync($PATH, 0o666)
      - pattern: >-
          fs.chmod($PATH, 0o777, ...)
      - pattern: >-
          fs.chmod($PATH, 0o666, ...)
