rules:
  - id: kisa.javascript.code-injection.external-input-to-dynamic-code

    languages:
      - javascript

    message: >
      외부 입력값이 동적 코드 실행 함수로 전달되고 있습니다.
      eval 또는 Function 생성자에 외부 입력값을 직접 전달하지 말고,
      필요한 경우 허용목록 기반의 명시적인 동작 매핑을 사용하세요.

    severity: ERROR

    mode: taint

    metadata:
      kisa_identifier: KISA-SW-002
      kisa_name: 코드 삽입
      confidence: high
      recommendation: >
        eval, Function과 같은 동적 코드 실행 기능의 사용을 피하세요.
        반드시 필요한 경우 외부 입력값을 코드로 직접 실행하지 말고
        허용목록 방식으로 검증된 값만 처리하세요.

    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$FIELD
          - pattern: $REQ.body.$FIELD
          - pattern: $REQ.params.$FIELD
          - pattern: $REQ.query[$FIELD]
          - pattern: $REQ.body[$FIELD]
          - pattern: $REQ.params[$FIELD]

    pattern-sinks:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: new Function($CODE)
          - pattern: Function($CODE)
