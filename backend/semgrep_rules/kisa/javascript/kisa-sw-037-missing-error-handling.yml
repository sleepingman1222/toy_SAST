rules:
  - id: kisa.sw37.javascript.empty-catch-block
    message: >-
      오류상황 대응 부재 관련 보안 패턴이 탐지되었습니다.
      빈 catch/catch callback으로 오류를 무시하지 말고 복구 또는 로깅/재throw를 구현하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-ERR-02"
      kisa_name: "오류상황 대응 부재"
      confidence: HIGH
      recommendation: >-
        빈 catch/catch callback으로 오류를 무시하지 말고 복구 또는 로깅/재throw를 구현하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-703
      technology:
        - "javascript"
        - "error-handling"

    pattern-either:
      - pattern: |
          try {
            ...
          } catch ($E) {
          }
      - pattern: >-
          $PROMISE.catch(($E) => {})
