rules:
  - id: kisa.sw25.javascript.insecure-random-for-security
    message: >-
      적절하지 않은 난수 값 사용 관련 보안 패턴이 탐지되었습니다.
      보안 토큰/인증값에는 Math.random 대신 crypto.randomBytes/randomInt/randomUUID를 사용하세요.
    languages:
      - javascript
    severity: ERROR

    metadata:
      kisa_identifier: "KISA-SW-25"
      kisa_name: "적절하지 않은 난수 값 사용"
      confidence: HIGH
      recommendation: >-
        보안 토큰/인증값에는 Math.random 대신 crypto.randomBytes/randomInt/randomUUID를 사용하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: implemented
      cwe:
        - CWE-338
      technology:
        - "javascript"
        - "nodejs"
        - "random"
        - "security"

    pattern-either:
      - pattern: >-
          Math.random()
