rules:
  - id: kisa.sw41.javascript.native-handle-use-after-free-review
    message: >-
      해제된 자원 사용 관련 보안 패턴이 탐지되었습니다.
      native addon/외부 handle을 해제한 뒤 다시 사용하는 흐름이 없는지 lifetime을 수동 검토하세요.
    languages:
      - javascript
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-41"
      kisa_name: "해제된 자원 사용"
      confidence: MEDIUM
      recommendation: >-
        native addon/외부 handle을 해제한 뒤 다시 사용하는 흐름이 없는지 lifetime을 수동 검토하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-416
      technology:
        - "javascript"
        - "native-addon"
        - "resource-lifetime"

    pattern-either:
      - pattern: |
          $NATIVE.free($HANDLE)
          ...
          $NATIVE.read($HANDLE, ...)
      - pattern: |
          $NATIVE.destroy($HANDLE)
          ...
          $NATIVE.write($HANDLE, ...)
