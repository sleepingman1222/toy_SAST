rules:
  - id: kisa.sw44.javascript.request-data-to-module-global-review
    message: >-
      잘못된 세션에 의한 데이터 정보노출 관련 보안 패턴이 탐지되었습니다.
      요청별 데이터를 module/global 공유 변수에 저장하지 말고 요청 객체 또는 사용자별 저장소에 격리하세요.
    languages:
      - javascript
    severity: WARNING

    metadata:
      kisa_identifier: "KISA-SW-44"
      kisa_name: "잘못된 세션에 의한 데이터 정보노출"
      confidence: MEDIUM
      recommendation: >-
        요청별 데이터를 module/global 공유 변수에 저장하지 말고 요청 객체 또는 사용자별 저장소에 격리하세요.
      rule_version: "1.0.0"
      kisa_guide_version: "2021.12.29"
      automation_level: partial
      cwe:
        - CWE-488
      technology:
        - "javascript"
        - "session"
        - "state"

    pattern-either:
      - pattern: >-
          $GLOBAL = $REQ.query.$KEY
      - pattern: >-
          $GLOBAL = $REQ.body.$KEY
