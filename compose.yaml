name: ${COMPOSE_PROJECT_NAME:-toy_sast}

services:
  frontend:
    build:
      context: ./frontend

    command: npm run dev -- --host 0.0.0.0

    init: true

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "${FRONTEND_PORT:-5173}:5173"


  backend:
    build:
      context: ./backend

    command: python manage.py runserver 0.0.0.0:8000

    init: true

    volumes:
      - ./backend:/app

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery:
    build:
      context: ./backend

    command: celery -A config worker --loglevel=${CELERY_LOG_LEVEL:-info}

    init: true

    volumes:
      - ./backend:/app

    env_file:
      - .env

    mem_limit: ${CELERY_MEMORY_LIMIT:-1536m}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery_beat:
    build:
      context: ./backend

    command: celery -A config beat --loglevel=${CELERY_LOG_LEVEL:-info} --schedule=/tmp/celerybeat-schedule

    init: true

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8-alpine

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
